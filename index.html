    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'soft-navy': '#1E293B',
                        'light-bg-1': '#F0F9FF', /* Very Light Blue */
                        'light-bg-2': '#F8FAFC', /* Soft White */
                        'btn-1': '#5B7C99', /* Soft denim blue */
                        'btn-2': '#64748B', /* Muted blue */
                        'btn-3': '#4F6272', /* Soft navy */
                        'btn-4': '#6B9080', /* Sage green */
                        'btn-5': '#5C8C94', /* Soft cyan */
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-5deg)' },
                            '50%': { transform: 'rotate(5deg)' },
                        }
                    },
                    animation: {
                        wiggle: 'wiggle 0.5s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F0F9FF 0%, #F8FAFC 50%, #E0F2FE 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animasi floating untuk elemen background */
        @keyframes float-up {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes float-down {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(30px) rotate(-8deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes float-diagonal {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            50% { transform: translate(20px, -20px) rotate(15deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }

        .bg-element {
            position: absolute;
            color: #0ea5e9; /* Light cyan text for background */
            font-weight: 700;
            pointer-events: none;
            z-index: -1;
            user-select: none;
            opacity: 0.08; /* Sangat transparan */
        }

        .float-1 { animation: float-up 8s ease-in-out infinite; top: 15%; left: 10%; font-size: 4rem; }
        .float-2 { animation: float-down 10s ease-in-out infinite; top: 20%; right: 15%; font-size: 5rem; }
        .float-3 { animation: float-diagonal 12s ease-in-out infinite; bottom: 25%; left: 15%; font-size: 4.5rem; }
        .float-4 { animation: float-up 9s ease-in-out infinite; bottom: 15%; right: 10%; font-size: 3.5rem; }
        .float-5 { animation: float-down 11s ease-in-out infinite; top: 50%; left: 50%; font-size: 6rem; transform: translateX(-50%); opacity: 0.04;}

        /* Efek Ripple */
        .ripple-btn {
            position: relative;
            overflow: hidden;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            background-color: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }
        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

    <!-- JavaScript for Interactions -->
    <script>
        document.querySelectorAll('.ripple-btn').forEach(button => {
            button.addEventListener('mousedown', function (e) {
                const rect = button.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const circle = document.createElement('span');
                circle.classList.add('ripple');
                
                const diameter = Math.max(rect.width, rect.height);
                const radius = diameter / 2;
                
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${x - radius}px`;
                circle.style.top = `${y - radius}px`;

                button.appendChild(circle);

                setTimeout(() => {
                    circle.remove();
                }, 600);
            });
        });
    </script>
