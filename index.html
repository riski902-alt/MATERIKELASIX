    <style>
        body {

            position: relative;

        /* Dark Glassmorphism Card Style for Buttons */
        .glass-card-dark {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25), 0 4px 6px -2px rgba(15, 23, 42, 0.1);
        }

        /* Hover animation untuk tombol gelap */
        .interactive-btn {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .interactive-btn:hover {
            transform: translateY(-5px) scale(1.01);
            background: rgba(30, 41, 59, 0.96);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 20px 30px -8px rgba(14, 165, 233, 0.25), 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .interactive-btn:hover .btn-icon-wrapper {
            transform: scale(1.1) rotate(-3deg);
        }

        .interactive-btn:active {
            transform: scale(0.97) translateY(-2px);
            box-shadow: 0 5px 12px -3px rgba(14, 165, 233, 0.3);
        }

        /* Animated Floating Background Tech Elements */
        .bg-float-item {
            position: absolute;
            pointer-events: none;
            user-select: none;
            opacity: 0.08;
            animation: floatAnimation 14s infinite ease-in-out;
            color: #0284c7;
        }

        @keyframes floatAnimation {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-25px) rotate(12deg);
            }
        }

        /* Ripple effect CSS */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.6s linear;
            background-color: rgba(56, 189, 248, 0.35);
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

    <!-- INTERACTIVE JAVASCRIPT -->
    <script>
        function handleButtonClick(destinationUrl, event) {
            const button = event.currentTarget;

            // 1. Ripple Effect Animation
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            const rect = button.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");

            const existingRipple = button.getElementsByClassName("ripple")[0];
            if (existingRipple) {
                existingRipple.remove();
            }

            button.appendChild(circle);

            // 2. Interactive Toast Feedback
            showToast(`Mengarahkan ke: ${destinationUrl}`);

            // 3. Navigation Delay
            setTimeout(() => {
                if (destinationUrl.startsWith("http://") || destinationUrl.startsWith("https://")) {
                    window.location.href = destinationUrl;
                } else {
                    console.log("Navigasi ke placeholder link:", destinationUrl);
                }
            }, 350);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            
            toastText.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 2500);
        }
    </script>
